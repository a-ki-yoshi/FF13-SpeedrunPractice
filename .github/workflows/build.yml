# CI for the PUBLIC FF13-SpeedrunPractice repo. This file lives in the private monorepo at
# ff13_sr_practice/publish/build.yml and is placed at .github/workflows/build.yml by publish.sh --
# deliberately NOT under the monorepo's own .github/, so it never runs there.
#
# zig cross-compiles the x86 Windows DLL on a Linux runner: no Windows runner, no game files.
# A v* tag builds, packages the release zip and publishes it; pull requests and a manual
# dispatch build only. NOT plain pushes to main: publish.sh pushes main and the tag together,
# at the same commit, so a branch trigger would only ever compile the tag's tree a second time.
name: build

on:
  push:
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create a Release on tags

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ZIG_VERSION: "0.17.1"   # keep in sync with the private repo's vendored toolchain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install zig ${{ env.ZIG_VERSION }}
        run: |
          set -euo pipefail
          V="$ZIG_VERSION"; found=""
          # zig changed its archive naming across versions; try both orders.
          for name in "zig-x86_64-linux-$V" "zig-linux-x86_64-$V"; do
            if curl -fSL "https://ziglang.org/download/$V/$name.tar.xz" -o zig.tar.xz; then
              found="$name"; break
            fi
          done
          test -n "$found" || { echo "::error::zig $V download failed"; exit 1; }
          mkdir -p "$HOME/zigtc"
          tar -xJf zig.tar.xz -C "$HOME/zigtc" --strip-components=1
          echo "ZIG=$HOME/zigtc/zig" >> "$GITHUB_ENV"

      - name: Build dinput8.dll
        run: ./src/build.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FF13-SpeedrunPractice-dinput8
          path: src/out/dinput8.dll
          if-no-files-found: error

      - name: Publish Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # One flat zip: everything lands in the game's bin folder, so "extract the zip
          # there" is the whole install. Loose .bat/.dll downloads also trip browser
          # warnings that a zip avoids. No ini: every setting has a built-in default and the
          # settings screen writes the file, so an ini in the zip would overwrite a player's own
          # settings on every update. The two launchers are the with/without-tools way to
          # start the game (run parks the DLL).
          # LICENSE travels WITH the binary because GPLv3 asks it to: the zip is what gets
          # passed around, and a copy re-shared from a chat has nothing else to go on. The
          # READMEs come along because the crash-report steps are read at the moment of the
          # crash, in this very folder, by someone who is not going back to a web page.
          zip -j "FF13-SpeedrunPractice-$GITHUB_REF_NAME.zip" \
            src/out/dinput8.dll \
            ff13-practice.bat \
            ff13-run.bat \
            README.md \
            README.ja.md \
            LICENSE
          # Linux (Steam / Proton) gets its own zip: the same dll with .sh launchers in place of the
          # .bat ones, so neither zip carries files its players cannot use. zip keeps the scripts'
          # executable bit from the checkout.
          zip -j "FF13-SpeedrunPractice-$GITHUB_REF_NAME-linux.zip" \
            src/out/dinput8.dll \
            ff13-practice.sh \
            ff13-run.sh \
            README.md \
            README.ja.md \
            LICENSE
          # A release for this tag can already exist -- the tag gets moved when a version is
          # re-cut before anyone has it, and `gh release create` fails outright on a duplicate.
          # Replace the asset in that case rather than failing the run.
          # Notes come from .github/RELEASE_NOTES.md in the tagged tree -- written and
          # reviewed before the push, never generated (main is one commit per version, so
          # --generate-notes would say nothing).
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "FF13-SpeedrunPractice-$GITHUB_REF_NAME.zip" "FF13-SpeedrunPractice-$GITHUB_REF_NAME-linux.zip" --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --notes-file .github/RELEASE_NOTES.md
          else
            gh release create "$GITHUB_REF_NAME" \
              "FF13-SpeedrunPractice-$GITHUB_REF_NAME.zip" "FF13-SpeedrunPractice-$GITHUB_REF_NAME-linux.zip" \
              --title "FF13-SpeedrunPractice $GITHUB_REF_NAME" \
              --notes-file .github/RELEASE_NOTES.md
          fi
